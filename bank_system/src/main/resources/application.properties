spring.application.name=bank_system
server.port=8083

# --- Database (PostgreSQL) ---
# Prefer environment variables for real credentials in production; the
# defaults below are for local development only.
spring.datasource.url=jdbc:postgresql://localhost:5432/bankdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Santosh@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
# jwt.secret MUST be a Base64-encoded key of at least 256 bits for HS256.
# Override with an environment variable in real deployments; do not commit
# a production secret to source control.
jwt.secret=${JWT_SECRET:B7pFEYFsvRx94N6bWaVjlNWbsMtUNC145eWAx8HPxCQ=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Error handling ---
# Don't leak internal exception details/stack traces in HTTP responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never